name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # tests + JaCoCo report + PIT mutation gate (fails below the threshold in pom.xml)
      - run: mvn -B verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-reports
          path: |
            target/site/jacoco
            target/pit-reports
